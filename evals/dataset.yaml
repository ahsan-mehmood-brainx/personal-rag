# Eval dataset for the synthetic persona "Jordan Avery" (tests/fixtures/persona/).
# Categories: answerable, missing, out_of_scope, topic_overlap, adversarial, meta.
# `expected_sources`: every listed file must appear among the returned sources.
# `must_include`: every string must appear in the answer (case-insensitive); answered cases only.

# --- answerable: direct facts -----------------------------------------------------------
