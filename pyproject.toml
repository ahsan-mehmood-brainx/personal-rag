[project]
name = "personal-rag"
version = "0.1.0"
description = "Local personal RAG assistant that answers questions about its owner from uploaded documents only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "openai==3.57.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pymupdf==2.1",
    "python-docx==1.2.0",
    "python-multipart==0.0.34",
    "pyyaml==6.0.4",
    "streamlit==1.67.0",
    "tiktoken==0.14.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
    "S",   # bandit: security checks
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test file
"tests/**" = ["S101"]
# Prompt text is kept verbatim from the spec; wrapping it would change what the model sees.
"src/personal_rag/llm/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pymupdf's SWIG bindings emit these on import; they are not ours to fix.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]
